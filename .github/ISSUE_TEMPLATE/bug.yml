name: Bug report
description: Report a reproducible DevWarden defect.
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private repository names, or signed legal forms.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Explain what should happen and what happened.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a small example with no private data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and sanitized diagnostics
      description: Include operating system, Python version, Git version, and relevant errors.
